services:
  postgres:
    image: postgres:16-alpine
    container_name: dber-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dber
      POSTGRES_USER: dber
      POSTGRES_PASSWORD: dber_dev_password
    ports:
      - "5432:5432"
    volumes:
      - dber_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dber -d dber"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dber_postgres_data: